# Distribution package as a GitHub Release: git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # tests + target/glang-<version>.zip / .tar.gz
      - run: mvn -B clean package

      - run: gh release create "$GITHUB_REF_NAME" target/glang-*.zip target/glang-*.tar.gz --title "GLang $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
